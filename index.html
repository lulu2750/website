<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角比 一問一答クイズ</title>
    <!-- ここで別ファイルのCSSを読み込んでいます -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <div id="quiz-box">
        <div class="progress" id="progress-text">第 1 問 / 5 問</div>
        <div class="question" id="question-text">問題がここに表示されます</div>
        <button class="btn answer-btn" id="show-answer-btn" onclick="showAnswer()">答えを見る</button>
        
        <div class="answer-section" id="answer-section">
            <div class="answer-label">正解</div>
            <div class="answer-text" id="answer-text">答え</div>
            
            <div class="explanation-box">
                <div class="explanation-label">解説</div>
                <div class="explanation-text" id="explanation-text">解説文</div>
            </div>
            
            <button class="btn next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>
</div>

<script>
    // 問題データ
    const originalQuizData = [
        { q: "sin 30° の値は？", a: "1/2", e: "30°の直角三角形の比は 1 : √3 : 2 です。sinは (対辺 / 斜辺) なので 1/2 となります。" },
        { q: "cos 45° の値は？", a: "1 / √2  (または √2/2)", e: "45°の直角三角形の比は 1 : 1 : √2 です。cosは (底辺 / 斜辺) なので 1/√2 となります。" },
        { q: "tan 60° の値は？", a: "√3", e: "60°の直角三角形の比は 1 : √3 : 2 です。tanは (対辺 / 底辺) なので √3/1 = √3 となります。" },
        { q: "sin 90° の値は？", a: "1", e: "単位円上のy座標に相当します。90°のときy座標は最大値の1になります。" },
        { q: "cos 0° の値は？", a: "1", e: "単位円上のx座標に相当します。0°のときx座標は最大値の1になります。" }
    ];

    let shuffledQuizData = [];
    let currentQuestionIndex = 0;

    function shuffleQuestions() {
        shuffledQuizData = [...originalQuizData];
        for (let i = shuffledQuizData.length - 1; i > 0; i--) {
            const r = Math.floor(Math.random() * (i + 1));
            const temp = shuffledQuizData[i];
            shuffledQuizData[i] = shuffledQuizData[r];
            shuffledQuizData[r] = temp;
        }
    }

    function loadQuestion() {
        if (currentQuestionIndex >= shuffledQuizData.length) {
            alert("すべての問題が終了しました！もう一度最初からランダムに出題します。");
            currentQuestionIndex = 0;
            shuffleQuestions();
        }
        
        const currentQuiz = shuffledQuizData[currentQuestionIndex];
        
        document.getElementById('progress-text').innerText = `第 ${currentQuestionIndex + 1} 問 / ${shuffledQuizData.length} 問`;
        document.getElementById('question-text').innerText = currentQuiz.q;
        document.getElementById('answer-text').innerText = currentQuiz.a;
        document.getElementById('explanation-text').innerText = currentQuiz.e;
        
        if (currentQuestionIndex === shuffledQuizData.length - 1) {
            document.getElementById('next-btn').innerText = "最初からやり直す";
        } else {
            document.getElementById('next-btn').innerText = "次の問題へ";
        }
        
        document.getElementById('answer-section').style.display = 'none';
        document.getElementById('show-answer-btn').style.display = 'block';
    }

    function showAnswer() {
        document.getElementById('answer-section').style.display = 'block';
        document.getElementById('show-answer-btn').style.display = 'none';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    shuffleQuestions();
    loadQuestion();
</script>

</body>
</html>
